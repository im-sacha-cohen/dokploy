# Messy but valid compose: inconsistent indentation widths, comments, anchors,
# merge keys, block scalars, flow lists and quoted values.
x-common: &common
        restart: unless-stopped
        labels:
            com.example.stack: "format-test"   # kept
services:
    web:
        <<: *common
        image: nginx:alpine
        ports: [ "18080:80" ]
        depends_on:
            cache:
                condition: service_healthy
        environment:
        - GREETING=hello world
        - "QUOTED=a: b # not a comment"
        command:
            - sh
            - -c
            - |
              echo "<h1>formatted</h1>" > /usr/share/nginx/html/index.html
              exec nginx -g "daemon off;"
    cache:
            <<: *common
            image: redis:7-alpine
            healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                retries: 10
            volumes:
            - cache-data:/data
volumes:
    cache-data: {}
